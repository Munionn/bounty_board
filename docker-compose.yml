services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bounty_board
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bounty_board"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage for submission assets
  # Image from Quay — MinIO removed Docker Hub distribution
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: bounty_board-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: SUPERsecurepassword5.
    volumes:
      - minio_storage:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-32Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 admin SUPERsecurepassword5.;
      mc mb local/bounty-submissions --ignore-existing;
      mc cors set local/bounty-submissions /scripts/minio-cors.json;
      echo 'MinIO bucket + CORS ready';
      "
    volumes:
      - ./scripts:/scripts:ro

volumes:
  minio_storage:
